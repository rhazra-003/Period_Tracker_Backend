spring.application.name=periodtracker

# PostgreSQL DB config (default works for local dev; deploy with env vars)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/period_tracker?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=${PORT:8081}

# CORS origins (comma-separated; e.g. http://localhost:5173,https://your-frontend.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Time zone
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false